# LLaMA 75M params
# Supersedes Llama-77m.toml. Only ONE key differs: num_key_value_heads 4 -> 2.

model_type = "llama"
tie_word_embeddings = true
hidden_size = 768          # embedding dimension
intermediate_size = 2048   # FFN hidden size
max_position_embeddings = 1024
num_attention_heads = 8    # query heads
num_hidden_layers = 8      # transformer layers
num_key_value_heads = 2    # GQA 4:1 — see header
vocab_size = 32768         # CHANGE THIS to match the new tokenizer
