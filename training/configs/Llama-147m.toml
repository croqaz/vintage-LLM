
# LLaMA 147.9M params / 25.2M embeddings
# huggingface/transformers/.. models/llama/configuration_llama.py

model_type = "llama"
tie_word_embeddings = true
hidden_size = 768          # embedding dimension
intermediate_size = 2560   # FFN hidden size (typically 4x hidden_size)
max_position_embeddings = 2048
num_attention_heads = 8    # attention heads (must divide hidden_size evenly)
num_hidden_layers = 16     # transformer layers
num_key_value_heads = 4
vocab_size = 32768
